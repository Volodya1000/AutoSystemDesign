name: Temporary performance JSON Schema publishing
on:
  push:
    branches:
      - test/performance-pipeline-e2e
    paths:
      - .github/workflows/temporary-performance-schema.yml
      - scripts/export_performance_schema.py
permissions:
  contents: write
jobs:
  export-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Publish schema from actual locked dependencies
        run: |
          uv sync --locked --all-groups
          uv run python scripts/export_performance_schema.py --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/performance-analysis/report.schema.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish reproducible v1 performance JSON Schema"
            git push origin HEAD:test/performance-pipeline-e2e
          fi
