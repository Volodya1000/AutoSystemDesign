name: Property-based tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  properties:
    name: Hypothesis domain invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked project dependencies
        run: uv sync --locked --all-groups
      - name: Check property-test typing
        run: uv run --with hypothesis==6.170.2 mypy --strict property_tests
      - name: Run property-based tests
        run: uv run --with hypothesis==6.170.2 pytest property_tests -q
