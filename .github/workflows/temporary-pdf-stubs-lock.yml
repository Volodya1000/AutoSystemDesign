name: Temporary PDF stub lockfile regeneration
on:
  push:
    branches:
      - feat/performance-report-pdf
    paths:
      - pyproject.toml
permissions:
  contents: write
jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Resolve and commit lockfile
        run: |
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: lock ReportLab type stubs for strict mypy"
            git push origin HEAD:feat/performance-report-pdf
          fi
