name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Lint, formatting, and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run all pre-commit checks
        run: uv run pre-commit run --all-files
      - name: Check Ruff linting
        run: uv run ruff check .
      - name: Check Ruff formatting
        run: uv run ruff format --check .
      - name: Check Wemake Python Styleguide (all WPS rules)
        run: uvx --python 3.13 --from wemake-python-styleguide==1.8.1 flake8 src tests scripts --select=WPS

      - name: Run type checking
        run: uv run mypy --strict src tests scripts
      - name: Run pylint
        run: uv run pylint src tests scripts

  architecture:
    name: Architecture import rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Check architecture boundaries
        run: uv run python scripts/check_architecture_imports.py

  duplication:
    name: Duplicate-code regression check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Check duplicate code in changed files
        run: uv run python scripts/check_duplicate_code.py

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run unit tests
        run: uv run pytest tests/unit

  repository-hygiene:
    name: Repository hygiene and lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Check lockfile consistency
        run: uv lock --check
      - name: Check whitespace and end-of-file newlines
        run: uv run python scripts/check_file_hygiene.py
      - name: Check changed-line whitespace
        run: git diff --check
