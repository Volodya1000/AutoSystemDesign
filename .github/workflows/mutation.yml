name: Mutation tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  mutation:
    name: Mutmut domain pilot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked project dependencies
        run: uv sync --locked --all-groups
      - name: Run focused mutation tests
        run: uv run --with mutmut==3.7.0 mutmut run
      - name: Show mutation results
        if: always()
        run: uv run --with mutmut==3.7.0 mutmut results
