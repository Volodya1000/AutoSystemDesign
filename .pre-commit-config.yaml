repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=no]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.6.10
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--no-fix]
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: file-hygiene
        name: Check whitespace and end-of-file newlines
        entry: uv run python scripts/check_file_hygiene.py
        language: system
        pass_filenames: false
        always_run: true

      - id: uv-lock-check
        name: Check uv lockfile consistency
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format-check
        name: Ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: wemake-python-styleguide
        name: Wemake Python Styleguide (full repository, no suppressions)
        entry: uvx --python 3.13 --from wemake-python-styleguide==1.8.1 flake8 src tests scripts --select=WPS
        language: system
        pass_filenames: false
        always_run: true

      - id: lint-suppression-guard
        name: Reject inline lint and type suppressions
        entry: uv run python scripts/check_lint_suppressions.py
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run mypy --strict src tests scripts
        language: system
        pass_filenames: false
        always_run: true

      - id: pylint
        name: pylint
        entry: uv run pylint src tests scripts
        language: system
        pass_filenames: false
        always_run: true

      - id: duplicate-code
        name: Detect duplicate code in changed Python files
        entry: uv run python scripts/check_duplicate_code.py
        language: system
        types: [python]

      - id: import-linter
        name: Check architecture import rules
        entry: uv run python scripts/check_architecture_imports.py
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Unit tests
        entry: uv run pytest -m unit
        language: system
        pass_filenames: false
        always_run: true
