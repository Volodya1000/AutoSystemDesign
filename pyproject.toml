[project]
name = "autosystemdesign"
version = "0.1.0"
description = "LLM-assisted generation and validation of software architecture and REST API artifacts from scenario specifications"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "litellm>=1.104.2",
    "pydantic>=2.14.0",
    "pydantic-settings[yaml]>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s: %(message)s"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that call a real LLM via LM Studio",
]

[tool.ruff.lint]
ignore = ["TRY003", "EM101"]  # Avoid forcing one-off exception classes for every validation message.
# Add design-oriented checks while keeping Ruff's existing default rules.
extend-select = [
    "A",     # Prevent shadowing Python builtins.
    "ANN202", # Require return annotations on private functions.
    "B",     # Bugbear: likely bugs and error-prone constructs.
    "C90",   # McCabe: excessive cyclomatic complexity.
    "FBT",   # Boolean traps in function interfaces and calls.
    "PERF",  # Avoid common performance anti-patterns.
    "PIE",   # Remove unnecessary code constructs.
    "RET",   # Consistent, explicit return paths.
    "SIM",   # Simplify unnecessarily complicated control flow.
    "TC",    # Type-checking import and annotation rules.
    "TID",   # Keep imports explicit and maintainable.
    "TRY",   # Exception handling and error-design rules.
    "PLR0911", # Keep functions from accumulating too many return paths.
    "PLR0912", # Keep branching logic manageable.
    "PLR0913", # Keep function interfaces small.
    "PLR0914", # Keep functions from accumulating too many local variables.
    "PLR0915", # Keep functions focused on one responsibility.
    "PLR1702", # Keep control flow from becoming deeply nested.
    "PLR0917", # Avoid APIs that require many positional arguments.
    "PLR1714", # Replace repeated equality checks with membership tests.
    "SLF",    # Enforce encapsulation by preventing private-member access.
    "ARG005", # Remove unused lambda parameters.
    "S607",   # Review subprocess calls using partial executable paths.
    "PT011",  # Require specific exception expectations in pytest.
    "RUF043", # Avoid ambiguous regular expressions in pytest.raises.
    "EM101", # Avoid raising exceptions directly from string literals.
    "PT018", # Keep each pytest assertion focused.
    "PT006", # Use explicit parameterization argument names.
    "ANN001", # Require parameter type annotations.
    "ANN002", # Require annotations for variadic positional arguments.
    "UP042",  # Prefer StrEnum for string enums.
    "ERA001", # Remove commented-out code.
    "D205", # Require a blank line between docstring summary and body.
    "D404", # Avoid starting docstrings with "This".
    "RUF002", # Avoid ambiguous Unicode in docstrings.
    "RUF005", # Prefer clearer sequence concatenation.
]
# All enabled rules must be fixed rather than suppressed.

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.13"
mypy_path = "src"

[tool.pylint."messages control"]
disable = [
    "import-outside-toplevel",
    "inconsistent-return-statements",
    "missing-docstring",
    "redefined-outer-name",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "unused-argument",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
