[project]
name = "autosystemdesign"
version = "0.1.0"
description = "LLM-assisted generation and validation of software architecture and REST API artifacts from scenario specifications"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "litellm>=1.104.2",
    "pydantic>=2.14.0",
    "pydantic-settings[yaml]>=2.15.0",
    "reportlab>=4.4,<5",
    "simpy>=4.1.2,<5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "pypdf>=5,<7",
    "ruff>=0.16.8",
    "types-reportlab>=4.4.10,<5",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s: %(message)s"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that call a real LLM via LM Studio",
]

[tool.ruff.lint]
# Add design-oriented checks while keeping Ruff's existing default rules.
extend-select = [
    "A",     # Prevent shadowing Python builtins.
    "ANN202", # Require return annotations on private functions.
    "B",     # Bugbear: likely bugs and error-prone constructs.
    "C90",   # McCabe: excessive cyclomatic complexity.
    "FBT",   # Boolean traps in function interfaces and calls.
    "PERF",  # Avoid common performance anti-patterns.
    "PIE",   # Remove unnecessary code constructs.
    "RET",   # Consistent, explicit return paths.
    "SIM",   # Simplify unnecessarily complicated control flow.
    "TC",    # Type-checking import and annotation rules.
    "TID",   # Keep imports explicit and maintainable.
    "TRY400", # Prefer logging.exception when reporting an active exception.
    "TRY401", # Avoid redundant exception objects in logging.exception calls.
    "PLR0911", # Keep functions from accumulating too many return paths.
    "PLR0912", # Keep branching logic manageable.
    "PLR0913", # Keep function interfaces small.
    "PLR0914", # Keep functions from accumulating too many local variables.
    "PLR0915", # Keep functions focused on one responsibility.
    "PLR1702", # Keep control flow from becoming deeply nested.
    "PLR0917", # Avoid APIs that require many positional arguments.
    "PLR1714", # Replace repeated equality checks with membership tests.
    "SLF",    # Enforce encapsulation by preventing private-member access.
    "ARG005", # Remove unused lambda parameters.
    "ANN401", # Avoid unconstrained Any annotations.
    "RUF001", # Avoid ambiguous Unicode in string literals.
    "S101", # Prevent production code from relying on assert for validation.
    "T201", # Route user-facing output through logging instead of print.
    "S603",  # Audit subprocess calls even when shell execution is disabled.
    "S607",   # Review subprocess calls using partial executable paths.
    "S310",  # Audit potentially unsafe URL-opening calls.
    "EM101", # Keep exception messages in named variables for tracebacks.
    "PLC0415", # Keep imports at module scope unless laziness is intentional.
    "PT011",  # Require specific exception expectations in pytest.
    "RUF043", # Avoid ambiguous regular expressions in pytest.raises.
    "INP001", # Require explicit package markers for source, scripts, and tests.
    "ARG001", # Remove unused function arguments.
    "ARG002", # Remove unused method arguments.
    "PT018", # Keep each pytest assertion focused.
    "PT006", # Use explicit parameterization argument names.
    "ANN001", # Require parameter type annotations.
    "ANN002", # Require annotations for variadic positional arguments.
    "UP042",  # Prefer StrEnum for string enums.
    "ERA001", # Remove commented-out code.
    "D205", # Require a blank line between docstring summary and body.
    "D401", # Require docstrings to use imperative mood.
    "PLR2004", # Replace unexplained magic values with named constants.
    "D404", # Avoid starting docstrings with "This".
    "RUF002", # Avoid ambiguous Unicode in docstrings.
    "RUF005", # Prefer clearer sequence concatenation.
    "E501",   # Apply the configured 88-column line limit consistently.
]
# Fix all enabled lint findings without inline suppressions.
allowed-confusables = ["а", "е", "о", "р", "с", "С"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow assertions in tests.
    "PLR2004", # Keep readable literal expectations in tests.
]
"property_tests/**/*.py" = [
    "S101",    # Property tests also use pytest assertions.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 88.5
precision = 2
show_missing = true
skip_covered = true

[tool.pylint."messages control"]
disable = [
    "import-outside-toplevel",
    "inconsistent-return-statements",
    "missing-docstring",
    "redefined-outer-name",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "unused-argument",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mutmut]
# Ограниченный пилот: проверяем доменную логику численных требований.
source_paths = ["src/"]
only_mutate = ["src/domain/models/base_constraints.py"]
also_copy = ["scripts/", "scenarios/", "examples/", "config.yaml"]
pytest_add_cli_args_test_selection = ["tests/unit"]

[tool.commitizen]
name = "cz_conventional_commits"

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
