[project]
name = "autosystemdesign"
version = "0.1.0"
description = "LLM-assisted generation and validation of software architecture and REST API artifacts from scenario specifications"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "litellm>=1.104.2",
    "pydantic>=2.14.0",
    "pydantic-settings[yaml]>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s: %(message)s"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that call a real LLM via LM Studio",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
# Temporarily evaluate all Ruff rules except docstrings and Ruff formatter conflicts.
select = ["ALL"]
ignore = ["D", "DOC", "missing-trailing-comma", "single-line-implicit-string-concatenation"]
# Fix all enabled lint findings without inline suppressions.
allowed-confusables = ["а", "е", "о", "р", "с", "С"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "assert",    # Allow assertions in tests.
    "magic-value-comparison", # Keep readable literal expectations in tests.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.pylint."messages control"]
disable = ["missing-docstring"]

[tool.pylint.design]
# Single-purpose validators, protocols, and adapters legitimately expose one operation.
min-public-methods = 1

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
