[project]
name = "autosystemdesign"
version = "0.1.0"
description = "LLM-assisted generation and validation of software architecture and REST API artifacts from scenario specifications"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "litellm>=1.104.2",
    "pydantic>=2.14.0",
    "pydantic-settings[yaml]>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s: %(message)s"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that call a real LLM via LM Studio",
]

[tool.ruff.lint]
# Enable the complete Ruff rule set; resolve findings rather than suppressing them.
select = ["ALL"]
ignore = [
    "D203",   # Conflicts with D211.
    "D213",   # Conflicts with D212.
    "COM812", # Conflicts with the formatter.
    "COM819", # Conflicts with the formatter.
    "ISC001", # Conflicts with the formatter.
    "ISC002", # Conflicts with the formatter.
    "CPY001", # Copyright headers are not required for this project.
    "TD002",  # TODO author attribution is not required.
    "TD003",  # TODO issue links are not required.
    "FIX002", # TODO comments are permitted.
    "D100",   # Public module docstrings are not required.
    "D101",   # Public class docstrings are not required.
    "D102",   # Public method docstrings are not required.
    "D103",   # Public function docstrings are not required.
    "D104",   # Public package docstrings are not required.
    "D105",   # Public magic-method docstrings are not required.
    "D107",   # Public __init__ docstrings are not required.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.13"
mypy_path = "src"

[tool.pylint."messages control"]
disable = [
    "import-outside-toplevel",
    "inconsistent-return-statements",
    "missing-docstring",
    "redefined-outer-name",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "unused-argument",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
