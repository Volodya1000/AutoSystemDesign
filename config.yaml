# Non-secret local configuration.
# base_url and api_key are env-only (ASD_BASE_URL / ASD_API_KEY)
# and are intentionally absent from this file.
# NOTE: max_tokens must cover the full JSON answer; finish_reason=length
# in the client log means the answer was truncated mid-JSON.
llm:
  model: openai/qwen2.5-coder-14b-instruct
  temperature: 0.2
  max_tokens: 16000
  # Optional: actual context limit configured for the model in LM Studio.
  # Keep this aligned with the context size configured for the loaded model.
  context_window_tokens: 32768
  timeout_seconds: 500.0
  structured_output_mode: prompt
generation:
  max_attempts: 3
  sequence_parallelism: 3
# Diagram rendering backend:
#   server       - auto | plantuml | kroki | http(s)://<self-hosted plantuml-server>
#                  "auto" = public PlantUML server with the public Kroki
#                  gateway as an automatic fallback.
#   image_format - png | svg
#   diagram_dir  - where .puml and image files are written.
# Per-run CLI overrides: --diagram-server / --diagram-format / --out-dir.
# Environment override example: ASD_VISUALISATION__SERVER=kroki
visualisation:
  server: auto
  image_format: png
  diagram_dir: output/diagrams
