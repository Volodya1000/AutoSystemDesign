services:
  plantuml-server:
    image: plantuml/plantuml-server:jetty
    container_name: asd-plantuml-server
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PLANTUML_LIMIT_SIZE: "8192"
      JAVA_OPTIONS: "-Xms64m -Xmx512m"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped
