# Test-owned configuration, selected by integration tests via APP_CONFIG_FILE.
# llm.model must match the model loaded in LM Studio.
# temperature is pinned to 0.0 by the integration conftest anyway.
llm:
  model: openai/qwen2.5-coder-14b-instruct
  temperature: 0.0
  max_tokens: 16000
  timeout_seconds: 380.0
  structured_output_mode: prompt
generation:
  max_attempts: 3
testing:
  generation_runs: 3
  min_single_shot_success_rate: 1.0
